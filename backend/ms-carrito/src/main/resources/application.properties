spring.application.name=carrito
server.port=${SERVER_PORT:8083}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
carrito.security.jwt.authorities-claim=${JWT_AUTHORITIES_CLAIM:authorities}
carrito.security.jwt.authority-prefix=${JWT_AUTHORITY_PREFIX:ROLE_}
carrito.integration.catalogo-url=${CATALOGO_BASE_URL:http://localhost:8081}
carrito.integration.catalogo-connect-timeout=${CATALOGO_CONNECT_TIMEOUT:3000}
carrito.integration.catalogo-read-timeout=${CATALOGO_READ_TIMEOUT:5000}
carrito.quote.hmac-secret=${CART_QUOTE_HMAC_SECRET}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
