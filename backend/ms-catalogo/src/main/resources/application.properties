spring.application.name=catalogo
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URI:${JWT_ISSUER_URI}/.well-known/jwks.json}
catalogo.security.jwt.authorities-claim=${JWT_AUTHORITIES_CLAIM:roles}
catalogo.security.jwt.authority-prefix=${JWT_AUTHORITY_PREFIX:ROLE_}
catalogo.security.jwt.audience=${JWT_AUDIENCE:ms-catalogo}
