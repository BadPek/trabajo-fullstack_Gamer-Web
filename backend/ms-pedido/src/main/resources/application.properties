spring.application.name=ms-pedido
server.port=${SERVER_PORT:8086}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:${DB_USERNAME}}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:${DB_USERNAME}}
spring.flyway.schemas=${DB_SCHEMA:${DB_USERNAME}}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8084}
pedido.security.jwt.authorities-claim=${JWT_AUTHORITIES_CLAIM:authorities}
pedido.security.jwt.authority-prefix=${JWT_AUTHORITY_PREFIX:ROLE_}
pedido.integration.carrito-url=${CARRITO_BASE_URL:http://localhost:8083}
pedido.integration.catalogo-url=${CATALOGO_BASE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
