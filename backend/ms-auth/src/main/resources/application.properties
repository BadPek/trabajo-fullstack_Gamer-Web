spring.application.name=ms-auth
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:${DB_USERNAME}}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:${DB_USERNAME}}
spring.flyway.schemas=${DB_SCHEMA:${DB_USERNAME}}

auth.jwt.issuer=${JWT_ISSUER_URI:http://localhost:8084}
auth.jwt.key-id=${JWT_KEY_ID:gamerzone-rsa-1}
auth.jwt.previous-public-keys-json=${JWT_PREVIOUS_PUBLIC_KEYS_JSON:[]}
auth.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:600}
auth.jwt.audiences=${JWT_AUDIENCES:ms-catalogo,ms-carrito,ms-contacto,ms-pedido}
auth.jwt.private-key=${JWT_PRIVATE_KEY}
auth.jwt.public-key=${JWT_PUBLIC_KEY}
auth.session.refresh-idle-days=${AUTH_REFRESH_IDLE_DAYS:7}
auth.session.refresh-absolute-days=${AUTH_REFRESH_ABSOLUTE_DAYS:30}
auth.session.cleanup-cron=${AUTH_SESSION_CLEANUP_CRON:0 0 3 * * *}
auth.csrf.expiration-seconds=${AUTH_CSRF_EXPIRATION_SECONDS:7200}
auth.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.password.argon2.salt-length=${AUTH_ARGON2_SALT_LENGTH:16}
auth.password.argon2.hash-length=${AUTH_ARGON2_HASH_LENGTH:32}
auth.password.argon2.parallelism=${AUTH_ARGON2_PARALLELISM:1}
auth.password.argon2.memory-kib=${AUTH_ARGON2_MEMORY_KIB:19456}
auth.password.argon2.iterations=${AUTH_ARGON2_ITERATIONS:2}
auth.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
auth.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
auth.admin-recovery.email=${AUTH_ADMIN_RECOVERY_EMAIL:}
auth.admin-recovery.password=${AUTH_ADMIN_RECOVERY_PASSWORD:}
auth.contact.base-url=${CONTACT_SERVICE_URL:http://localhost:8085}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
