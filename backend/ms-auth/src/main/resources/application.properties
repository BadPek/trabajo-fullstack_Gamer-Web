spring.application.name=ms-auth
server.port=${SERVER_PORT:8084}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:${DB_USERNAME}}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=${DB_SCHEMA:${DB_USERNAME}}
spring.flyway.schemas=${DB_SCHEMA:${DB_USERNAME}}

auth.jwt.issuer=${JWT_ISSUER_URI:http://localhost:8084}
auth.jwt.key-id=${JWT_KEY_ID:gamerzone-rsa-1}
auth.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
auth.jwt.private-key=${JWT_PRIVATE_KEY}
auth.jwt.public-key=${JWT_PUBLIC_KEY}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.path=/v3/api-docs
