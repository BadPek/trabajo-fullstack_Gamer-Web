<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito de Compras - GamerZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white text-dark">

    <!-- NAVBAR UNIFICADO MORADO -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-purple sticky-top" style="background: linear-gradient(135deg, #3c096c 0%, #5a189a 100%) !important;">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="index.html">
                <i class="bi bi-controller me-2 fs-3 text-warning"></i> GamerZone
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-1"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-grid me-1"></i> Juegos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html"><i class="bi bi-people me-1"></i> Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="blog.html"><i class="bi bi-newspaper me-1"></i> Noticias</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html"><i class="bi bi-envelope me-1"></i> Contacto</a></li>
                </ul>
                <div class="d-flex gap-2 align-items-center">
                    <a href="login.html" class="btn btn-outline-light btn-sm px-3">Iniciar Sesión</a>
                    <a href="registro.html" class="btn btn-light btn-sm text-purple fw-bold px-3">Registrarse</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN: MI CARRITO DE COMPRAS DINÁMICO -->
    <main class="container my-5 flex-grow-1">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h1 class="text-purple fw-bold mb-0">
                <i class="bi bi-cart3 me-2"></i> Mi Carrito de Compras
            </h1>
            <button class="btn btn-outline-danger btn-sm px-3" id="btn-vaciar-carrito">
                <i class="bi bi-trash3 me-1"></i> Vaciar Carrito
            </button>
        </div>

        <div class="row g-4">
            <!-- Lista dinámica de productos agregados -->
            <div class="col-12 col-lg-8">
                <div id="lista-carrito">
                    <!-- Se carga dinámicamente con JavaScript desde LocalStorage -->
                </div>

                <div class="mt-4">
                    <a href="productos.html" class="btn btn-outline-purple">
                        <i class="bi bi-arrow-left me-1"></i> Seguir Comprando Juegos
                    </a>
                </div>
            </div>

            <!-- Resumen de Pedido Dinámico -->
            <div class="col-12 col-lg-4">
                <div class="card border-0 shadow-sm p-4 bg-purple-light rounded-4">
                    <h5 class="fw-bold text-purple mb-3">Resumen de Compra</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Subtotal</span>
                        <span class="fw-semibold" id="carrito-subtotal">$0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Envío digital</span>
                        <span class="text-success fw-semibold">Gratis</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">TOTAL</span>
                        <span class="fs-5 fw-bold text-purple" id="carrito-total">$0</span>
                    </div>

                    <!-- Cupón de descuento -->
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="Cupón de descuento" id="input-cupon">
                        <button class="btn btn-outline-purple" type="button" onclick="aplicarCupon()">Aplicar</button>
                    </div>

                    <button class="btn btn-purple btn-lg w-100 fw-bold shadow-sm" id="btn-pagar-ahora" onclick="procesarPago()">
                        <i class="bi bi-credit-card me-2"></i> PAGAR AHORA
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="py-5 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-muted">&copy; 2026 GamerZone Store - Duoc UC. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function aplicarCupon() {
            const input = document.getElementById('input-cupon').value.trim().toUpperCase();
            if (input === 'DUOC2026' || input === 'GAMER10') {
                alert('¡Cupón aplicado con éxito! 10% de descuento concedido.');
            } else if (input === '') {
                alert('Ingresa un código de cupón.');
            } else {
                alert('Cupón no válido o expirado.');
            }
        }

        function procesarPago() {
            const carrito = obtenerCarrito();
            if (carrito.length === 0) {
                alert('Tu carrito está vacío. Agrega juegos antes de pagar.');
                return;
            }
            alert('¡Compra simulada exitosa! Se ha generado tu comprobante de compra.');
            localStorage.removeItem('gz_carrito');
            actualizarContadorCarrito();
            renderizarCarrito();
        }
    </script>
</body>
</html>
