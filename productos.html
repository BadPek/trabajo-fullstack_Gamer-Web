<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - GamerZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">
                <i class="bi bi-controller"></i> GamerZone
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="productos.html">Juegos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Figuras y Coleccionables</a></li>
                </ul>
                <button class="btn btn-outline-warning d-flex align-items-center" type="button">
                    <i class="bi bi-cart-fill me-2"></i> Carrito
                    <span class="badge bg-warning text-dark ms-2" id="contador-carrito">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="text-warning mb-4">Nuestros Juegos</h1>
        <div class="row" id="productos-container">
        </div>
    </div>

    <footer class="bg-black text-center py-4 mt-5">
        <p class="text-muted">&copy; 2024 GamerZone. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('productos-container');
            const juegos = obtenerJuegos();

            juegos.forEach(juego => {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4 mb-4';
                col.innerHTML = `
                    <div class="card card-gamer bg-secondary border-warning">
                        <img src="${juego.imagen}" class="card-img-top" alt="${juego.titulo}">
                        <div class="card-body">
                            <h5 class="card-title text-warning">${juego.titulo}</h5>
                            <p class="card-text text-light">${juego.descripcion}</p>
                            <h4 class="text-warning">$${juego.precio}</h4>
                            <div class="d-flex gap-2">
                                <a href="detalle.html?id=${juego.id}" class="btn btn-outline-warning flex-grow-1">Ver Detalle</a>
                                <button class="btn btn-warning btn-agregar">
                                    <i class="bi bi-cart-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });

            const botonesAgregar = document.querySelectorAll('.btn-agregar');
            const contadorCarrito = document.getElementById('contador-carrito');
            let totalItems = parseInt(contadorCarrito.textContent);

            botonesAgregar.forEach(boton => {
                boton.addEventListener('click', (event) => {
                    totalItems++;
                    contadorCarrito.textContent = totalItems;
                    
                    const btnOriginalHTML = boton.innerHTML;
                    boton.innerHTML = "<i class='bi bi-check-circle'></i>";
                    boton.classList.replace('btn-warning', 'btn-success');

                    setTimeout(() => {
                        boton.innerHTML = btnOriginalHTML;
                        boton.classList.replace('btn-success', 'btn-warning');
                    }, 1500);
                });
            });
        });
    </script>
</body>
</html>
