<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - GamerZone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-black sticky-top">
        <div class="container">
            <a class="navbar-brand text-warning fw-bold" href="index.html">
                <i class="bi bi-controller"></i> GamerZone
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Juegos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Figuras y Coleccionables</a></li>
                </ul>
                <button class="btn btn-outline-warning d-flex align-items-center" type="button">
                    <i class="bi bi-cart-fill me-2"></i> Carrito
                    <span class="badge bg-warning text-dark ms-2" id="contador-carrito">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <a href="productos.html" class="btn btn-outline-warning mb-4">
            <i class="bi bi-arrow-left"></i> Volver a Productos
        </a>

        <div id="detalle-container" class="row">
            <div class="col-md-6">
                <img id="detalle-imagen" src="" class="img-fluid border border-warning rounded" alt="Producto">
            </div>
            <div class="col-md-6">
                <h1 id="detalle-titulo" class="text-warning mb-3"></h1>
                <p id="detalle-descripcion" class="mb-4 text-light"></p>
                
                <div class="mb-4">
                    <h3 class="text-warning">$<span id="detalle-precio"></span></h3>
                </div>

                <div class="mb-4">
                    <h5 class="text-warning">Detalles:</h5>
                    <ul id="detalle-especificaciones" class="list-group list-group-flush bg-transparent">
                    </ul>
                </div>

                <button id="btn-agregar-detalle" class="btn btn-warning btn-lg btn-agregar w-100">
                    <i class="bi bi-cart-plus"></i> Agregar al Carrito
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-black text-center py-4 mt-5">
        <p class="text-muted">&copy; 2024 GamerZone. Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productoId = parseInt(urlParams.get('id'));
            const juegos = obtenerJuegos();
            const juego = juegos.find(j => j.id === productoId);

            if (juego) {
                document.getElementById('detalle-imagen').src = juego.imagen;
                document.getElementById('detalle-titulo').textContent = juego.titulo;
                document.getElementById('detalle-descripcion').textContent = juego.descripcion;
                document.getElementById('detalle-precio').textContent = juego.precio;

                const especsList = document.getElementById('detalle-especificaciones');
                juego.especificaciones.forEach(spec => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item bg-secondary text-light';
                    li.textContent = spec;
                    especsList.appendChild(li);
                });
            }

            const btnAgregar = document.getElementById('btn-agregar-detalle');
            const contadorCarrito = document.getElementById('contador-carrito');
            let totalItems = parseInt(contadorCarrito.textContent);

            btnAgregar.addEventListener('click', () => {
                totalItems++;
                contadorCarrito.textContent = totalItems;
                
                const btnOriginalHTML = btnAgregar.innerHTML;
                btnAgregar.innerHTML = "<i class='bi bi-check-circle'></i> ¡Agregado!";
                btnAgregar.classList.replace('btn-warning', 'btn-success');

                setTimeout(() => {
                    btnAgregar.innerHTML = btnOriginalHTML;
                    btnAgregar.classList.replace('btn-success', 'btn-warning');
                }, 1500);
            });
        });
    </script>
</body>
</html>
